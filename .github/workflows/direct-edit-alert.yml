name: Direct Live-Edit Alert

# Catches the negative test case: someone edits the LIVE theme directly in the
# Shopify admin, bypassing staging and the whole promote/approve pipeline.
# Staging should always be ahead of Prod; a direct live edit breaks that.
#
# Why "any shopify[bot] commit = alert" does not work
# -----------------------------------------------------
# `main` is connected to the live theme, so Shopify echoes EVERY theme change
# back as a commit authored by `shopify[bot]` — including the echo that
# follows our OWN approved promotes and code deploys. A workflow that alerts
# on every such commit fires on every legitimate release too.
#
# A first version tried to fix this by walking back to "the last commit we
# made ourselves" and comparing file lists. That FAILED in testing: code
# deploys are pushed via the Shopify CLI from a different repo
# (shopify-common) — they never create a matching commit inside this repo's
# own history, so every legitimate code deploy looked "unexpected" and fired a
# false alarm. Confirmed by testing, not assumed.
#
# The check that actually holds up: compare the echoed file's CONTENT against
# its real source of truth, not against this repo's commit history.
#   - code files (sections/snippets/blocks/layout/assets) -> source of truth
#     is shopify-common's theme/
#   - content files (templates/, config/settings_data.json) -> source of
#     truth is THIS repo's own `staging` branch (what promote reads from)
# If the live file matches its source, the echo is expected, however it got
# there. If it matches neither, nothing on our side produced it.

on:
  push:
    branches: [main]

permissions:
  contents: read
  issues: write

jobs:
  check:
    name: Check for an unexpected live edit
    runs-on: ubuntu-latest
    steps:
      - name: Is this even a Shopify echo commit?
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          AUTHOR=$(gh api "repos/$GITHUB_REPOSITORY/commits/${{ github.sha }}" --jq '.commit.author.name')
          echo "author=$AUTHOR"
          [ "$AUTHOR" = "shopify[bot]" ] && echo "is_echo=true" >> "$GITHUB_OUTPUT" || echo "is_echo=false" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.gate.outputs.is_echo == 'true'
        with:
          path: site
          fetch-depth: 2

      # actions/checkout with a single ref does not fetch other branches —
      # `origin/staging` would not exist locally otherwise, and the content-file
      # comparison below depends on it.
      - name: Fetch the staging branch too
        if: steps.gate.outputs.is_echo == 'true'
        working-directory: site
        run: git fetch origin staging

      - uses: actions/checkout@v4
        if: steps.gate.outputs.is_echo == 'true'
        with:
          repository: chinmay-garge/shopify-common
          path: hub
          ref: main
          token: ${{ secrets.ACCESS_PAT }}

      - name: Compare the echoed files against their real source of truth
        id: compare
        if: steps.gate.outputs.is_echo == 'true'
        run: |
          set -euo pipefail
          cd site
          CHANGED=$(git diff --name-only HEAD^ HEAD)
          echo "Changed in this echo commit:"
          echo "$CHANGED"

          strip_banner() { sed -e '1{/^\s*\/\*/,/\*\//d}' "$1" 2>/dev/null || true; }

          EXTRA=""
          for f in $CHANGED; do
            actual=$(git show HEAD:"$f" 2>/dev/null || echo "__MISSING__")

            case "$f" in
              templates/*|config/settings_data.json)
                # Content: source of truth is this repo's own staging branch.
                expected=$(git show origin/staging:"$f" 2>/dev/null || echo "__ABSENT_FROM_STAGING__")
                ;;
              *)
                # Code: source of truth is shopify-common's theme/.
                if [ -f "../hub/theme/$f" ]; then
                  expected=$(cat "../hub/theme/$f")
                else
                  expected="__ABSENT_FROM_SHOPIFY_COMMON__"
                fi
                ;;
            esac

            # Normalise: strip Shopify's auto-generated banner and surrounding
            # whitespace before comparing, so reformatting alone is not a mismatch.
            norm_actual=$(echo "$actual" | sed '1{/^\s*\/\*/,/\*\//d}' | tr -d '[:space:]')
            norm_expected=$(echo "$expected" | sed '1{/^\s*\/\*/,/\*\//d}' | tr -d '[:space:]')

            if [ "$norm_actual" != "$norm_expected" ]; then
              EXTRA="$EXTRA$f"$'\n'
              echo "MISMATCH: $f does not match its source of truth"
            else
              echo "ok: $f matches its source of truth"
            fi
          done

          EXTRA=$(echo "$EXTRA" | sed '/^$/d')
          if [ -n "$EXTRA" ]; then
            echo "unexpected=true" >> "$GITHUB_OUTPUT"
            { echo "extra<<EOF"; echo "$EXTRA"; echo "EOF"; } >> "$GITHUB_OUTPUT"
          else
            echo "unexpected=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Alert — assign an issue so GitHub emails the approver(s)
        if: steps.gate.outputs.is_echo == 'true' && steps.compare.outputs.unexpected == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RECIPIENTS: ${{ vars.ALERT_RECIPIENTS }}
          EXTRA: ${{ steps.compare.outputs.extra }}
        run: |
          set -euo pipefail
          gh label create "live-edit-alert" --repo "$GITHUB_REPOSITORY" \
            --color d93f0b -d "Live theme changed outside the normal promote pipeline" 2>/dev/null || true

          {
            echo "**A file on the live theme does not match its source of truth.**"
            echo ""
            echo "Code should match \`shopify-common\`'s \`theme/\`; content should match"
            echo "this repo's own \`staging\` branch. Neither matched, which means the"
            echo "change did not come from a code deploy or a promote — most likely"
            echo "someone edited the live theme directly in the Shopify admin."
            echo ""
            echo "Files involved:"
            echo '```'
            echo "$EXTRA"
            echo '```'
            echo ""
            echo "Commit: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}"
            echo ""
            echo "**Recommended next step:** check whether this change should be kept."
            echo "If yes, get it into \`staging\` (content) or \`shopify-common\` (code) too,"
            echo "so the live theme is not the only place holding it."
            echo "If not, it can be reverted like any promoted change."
          } > alert.md

          ASSIGNEES=$(echo "$RECIPIENTS" | tr ',' '\n' | sed '/^$/d' | xargs | tr ' ' ',')

          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "Live theme edited directly, outside the pipeline" \
            --label "live-edit-alert" \
            --assignee "$ASSIGNEES" \
            --body-file alert.md
